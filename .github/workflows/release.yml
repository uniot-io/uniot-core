name: Release

# Pushing a version tag is the single action that cuts a release: it runs the checks, creates
# the GitHub Release from the CHANGELOG, publishes the package, and (through
# generate-docs.yml, which triggers on the same tag) deploys the documentation.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  # The same checks pull requests get. A release cannot proceed without them.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      # pio pkg publish takes the version from library.json and ignores the tag, so this is
      # what stops a release from shipping something other than what the tag says.
      - name: Tag, library.json and UNIOT_CORE_VERSION agree
        run: ./scripts/check_version.sh "${{ steps.version.outputs.version }}"

      - name: Build the release notes
        run: |
          set -u
          version="${{ steps.version.outputs.version }}"
          if ./scripts/changelog-entry.sh "$version" > release-notes.md; then
            cat release-notes.md
          else
            echo "::warning::no CHANGELOG.md section for $version; releasing without notes"
            echo "Uniot Core $version" > release-notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false

  publish:
    name: PlatformIO registry
    needs: release
    runs-on: ubuntu-latest
    # This job needs nothing from GitHub beyond reading the code it publishes.
    permissions:
      contents: read
    # A published version can never be replaced or withdrawn, and the token can publish under
    # the organisation. Add reviewers to this environment and it becomes the last point where
    # a mistake can be stopped.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio esptool

      # pio pkg publish defaults to the token's own account, so a token from the wrong
      # account would publish into a personal namespace rather than failing. This asks the
      # registry whether the account may write to the package, before anything is uploaded.
      - name: The token may publish to uniot-io
        run: ./scripts/check_registry_access.sh uniot-io/uniot-core
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}

      - name: Publish
        run: pio pkg publish --owner uniot-io --no-interactive
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}

      # "It published" is not the same as "it published where we meant". The registry
      # processes an upload asynchronously, so a version can take minutes to appear: this
      # reports what it sees and warns if it has not caught up, rather than failing a release
      # that already succeeded. The publish cannot land in the wrong namespace anyway, because
      # --owner is explicit and the access check above runs first.
      - name: Confirm the version landed under uniot-io
        run: |
          set -uo pipefail
          expected="${GITHUB_REF#refs/tags/}"
          for attempt in $(seq 1 10); do
            published=$(pio pkg show uniot-io/uniot-core 2>/dev/null | sed -n 's/^Library • \([0-9][0-9.]*\) .*/\1/p')
            echo "attempt $attempt: registry reports '${published:-nothing}', expected $expected"
            if [ "$published" = "$expected" ]; then
              echo "uniot-io/uniot-core is at $expected"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::uniot-io/uniot-core still reports '${published:-nothing}' after 5 minutes. \
          The registry may simply be processing; confirm at \
          https://registry.platformio.org/libraries/uniot-io/uniot-core"
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
