name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  # So a release can depend on these checks instead of repeating them.
  workflow_call:

jobs:
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: library.json and UNIOT_CORE_VERSION agree
        run: ./scripts/check_version.sh

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP12E
            env: ESP12E
          - name: ESP32
            env: ESP32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'library.json') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # ci/ depends on the library through library.json, the way a consumer does. The project
      # in the root directory resolves its dependencies from sibling checkouts instead, so it
      # only builds on a developer's machine.
      - name: Build
        run: pio run -e ${{ matrix.env }}
        working-directory: ci
