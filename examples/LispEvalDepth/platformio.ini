; Diagnostic sketch: measures Lisp eval nesting against continuation stack usage.
; Build and flash from this directory:  pio run -t upload && pio device monitor

[platformio]
; The sketch lives beside this file rather than in src/.
src_dir = .

[env:esp12e]
platform = espressif8266
framework = arduino
board = esp12e
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = default, esp8266_exception_decoder

lib_extra_dirs = ../../lib
lib_deps =
	./../../../uniot-cbor
	./../../../uniot-lisp
	./../../../uniot-pubsubclient
	./../../../uniot-crypto
	./../../../uniot-esp-async-web-server

build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-D UNIOT_CREATOR_ID=\"UNIOT\"
	-D UNIOT_LOG_ENABLED=1
	-D UNIOT_USE_LITTLEFS=1
	-D UNIOT_LOG_LEVEL=UNIOT_LOG_LEVEL_DEBUG
	-D UNIOT_LISP_HEAP=10000
	-D MQTT_MAX_PACKET_SIZE=2048

[env:esp32c3]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
; No fixed port: a native-USB ESP32 re-enumerates on every reset, so /dev/ttyACMn
; changes underneath you. Let PlatformIO detect it, or pass a stable
; /dev/serial/by-id/... path explicitly.
monitor_filters = default, esp32_exception_decoder

lib_extra_dirs = ../../lib
lib_deps =
	./../../../uniot-cbor
	./../../../uniot-lisp
	./../../../uniot-pubsubclient
	./../../../uniot-crypto
	./../../../uniot-esp-async-web-server

build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-D UNIOT_CREATOR_ID=\"UNIOT\"
	-D UNIOT_LOG_ENABLED=1
	-D UNIOT_USE_LITTLEFS=1
	-D UNIOT_LOG_LEVEL=UNIOT_LOG_LEVEL_DEBUG
	-D UNIOT_LISP_HEAP=10000
	-D MQTT_MAX_PACKET_SIZE=2048
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D SERIALCONS=USBSerial
