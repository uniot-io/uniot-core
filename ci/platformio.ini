; Build-only project for CI.
;
; It depends on the library the way a consumer does, through library.json, which the project
; in the root directory does not: that one is a development harness that resolves the
; dependencies from sibling checkouts on a developer's machine.

[env]
framework = arduino
lib_deps = symlink://..
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-D UNIOT_CREATOR_ID=\"UNIOT\"
	-D UNIOT_LOG_ENABLED=1
	-D UNIOT_USE_LITTLEFS=1
	-D UNIOT_LOG_LEVEL=UNIOT_LOG_LEVEL_DEBUG
	-D MQTT_MAX_PACKET_SIZE=2048

[env:ESP12E]
platform = espressif8266
board = esp12e

[env:ESP32]
platform = espressif32
board = esp32doit-devkit-v1
