; Diagnostic sketch: measures Lisp eval nesting against the stack it consumes.
;
;   pio run -e esp12e-copying -t upload && pio device monitor
;
; Only the interpreter is linked. Uniot is not a dependency: the cost of a nesting level
; is a property of the interpreter, and leaving everything else out keeps it that way.
;
; The collector contributes a frame of its own while allocating, so there is an
; environment per strategy as well as per board.

[platformio]
; The sketch lives beside this file rather than in src/.
src_dir = .

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
	./../../../uniot-lisp
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	; Stack the firmware has already spent before it reaches eval. Left at 0 the
	; measurement describes the interpreter alone, which is optimistic for firmware.
	-D STACK_ALREADY_SPENT=0

[esp8266]
platform = espressif8266
board = esp12e
monitor_filters = default, esp8266_exception_decoder

[esp32]
platform = espressif32
board = esp32-c3-devkitm-1
; No fixed port: a native-USB ESP32 re-enumerates on every reset, so /dev/ttyACMn moves
; underneath you. Let PlatformIO detect it, or pass a /dev/serial/by-id/... path.
monitor_filters = default, esp32_exception_decoder
extra_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D SERIALCONS=USBSerial

[env:esp12e-copying]
platform = ${esp8266.platform}
board = ${esp8266.board}
monitor_filters = ${esp8266.monitor_filters}
build_flags =
	${env.build_flags}
	-D MINILISP_GC=MINILISP_GC_COPYING

[env:esp12e-mark-sweep]
platform = ${esp8266.platform}
board = ${esp8266.board}
monitor_filters = ${esp8266.monitor_filters}
build_flags =
	${env.build_flags}
	-D MINILISP_GC=MINILISP_GC_MARK_SWEEP

[env:esp32c3-copying]
platform = ${esp32.platform}
board = ${esp32.board}
monitor_filters = ${esp32.monitor_filters}
build_flags =
	${env.build_flags}
	${esp32.extra_flags}
	-D MINILISP_GC=MINILISP_GC_COPYING

[env:esp32c3-mark-sweep]
platform = ${esp32.platform}
board = ${esp32.board}
monitor_filters = ${esp32.monitor_filters}
build_flags =
	${env.build_flags}
	${esp32.extra_flags}
	-D MINILISP_GC=MINILISP_GC_MARK_SWEEP
