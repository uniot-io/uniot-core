; Diagnostic sketch: exercises the Lisp garbage collector on real hardware.
;
; The collection strategy is fixed when the library is compiled, so comparing two of them
; means flashing two builds. There is one environment per strategy per board:
;
;   pio run -e esp12e-copying -t upload    && pio device monitor
;   pio run -e esp12e-mark-sweep -t upload && pio device monitor
;
; Only the interpreter is pulled in. Uniot itself is not a dependency here, because WiFi,
; MQTT and the scheduler would add noise to the timings and pressure to the heap.

[platformio]
; The sketch lives beside this file rather than in src/.
src_dir = .

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
	./../../../uniot-lisp
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	; The verifier and the counters. Both are compiled out of a firmware build; this
	; sketch exists to use them.
	-D MINILISP_GC_DEBUG=1
	-D MINILISP_GC_STATS=1
	; Match the firmware, so the numbers describe what ships.
	-D UNIOT_LISP_HEAP=7000

[esp8266]
platform = espressif8266
board = esp12e
monitor_filters = default, esp8266_exception_decoder

; Both are here because a figure measured on the C3 (RISC-V) does not describe the
; plain ESP32 (Xtensa), or the reverse.
[esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
; No fixed port: a native-USB part re-enumerates on every reset, so /dev/ttyACMn moves
; underneath you. Let PlatformIO detect it, or pass a /dev/serial/by-id/... path.
monitor_filters = default, esp32_exception_decoder
extra_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D SERIALCONS=USBSerial

; Reaches the host through a UART bridge, not native USB, so none of the flags above.
[esp32]
platform = espressif32
board = esp32doit-devkit-v1
monitor_filters = default, esp32_exception_decoder
extra_flags =

[env:esp12e-copying]
platform = ${esp8266.platform}
board = ${esp8266.board}
monitor_filters = ${esp8266.monitor_filters}
build_flags =
	${env.build_flags}
	-D MINILISP_GC=MINILISP_GC_COPYING

[env:esp12e-mark-sweep]
platform = ${esp8266.platform}
board = ${esp8266.board}
monitor_filters = ${esp8266.monitor_filters}
build_flags =
	${env.build_flags}
	-D MINILISP_GC=MINILISP_GC_MARK_SWEEP

[env:esp32c3-copying]
platform = ${esp32c3.platform}
board = ${esp32c3.board}
monitor_filters = ${esp32c3.monitor_filters}
build_flags =
	${env.build_flags}
	${esp32c3.extra_flags}
	-D MINILISP_GC=MINILISP_GC_COPYING

[env:esp32c3-mark-sweep]
platform = ${esp32c3.platform}
board = ${esp32c3.board}
monitor_filters = ${esp32c3.monitor_filters}
build_flags =
	${env.build_flags}
	${esp32c3.extra_flags}
	-D MINILISP_GC=MINILISP_GC_MARK_SWEEP

[env:esp32-copying]
platform = ${esp32.platform}
board = ${esp32.board}
monitor_filters = ${esp32.monitor_filters}
build_flags =
	${env.build_flags}
	${esp32.extra_flags}
	-D MINILISP_GC=MINILISP_GC_COPYING

[env:esp32-mark-sweep]
platform = ${esp32.platform}
board = ${esp32.board}
monitor_filters = ${esp32.monitor_filters}
build_flags =
	${env.build_flags}
	${esp32.extra_flags}
	-D MINILISP_GC=MINILISP_GC_MARK_SWEEP
